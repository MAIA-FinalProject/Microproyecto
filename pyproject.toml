[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.workspace]


[project]
name = "ml-microproyecto"
version = "0.1.0"
description = "Prototipo de ML a Nivel Maestría con MLOps, DVC, MLflow, FastAPI y Streamlit"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "dvc-gdrive>=3.0.0",
    "dvc>=3.50.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "mlflow>=2.13.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0,<3.0.0",
    "pydantic-settings>=2.2.0",
    "pydantic>=2.7.0",
    "pyreadstat>=1.2.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.2",
    "streamlit>=1.35.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=1.10.0",
    "pandas-stubs>=2.2.0",
    "poethepoet>=0.26.0",
    "pre-commit>=3.7.0",
    "pytest-cov>=5.0.0",
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "types-requests>=2.31.0",
]

# ------------------------------------------------------------------------------
# Poe The Poet (Task Runner)
# ------------------------------------------------------------------------------
[tool.poe.tasks]
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format = "ruff format ."
format-check = "ruff format . --check"
typecheck = "mypy src api dashboard tests"
check = ["lint", "format-check", "typecheck"]
test = "pytest tests/ --cov=src --cov-report=term-missing"
pre-commit = "pre-commit run --all-files"
dev-api = "uvicorn api.main:app --reload --host 0.0.0.0 --port 8000"
dev-dashboard = "streamlit run dashboard/app.py --server.port 8501"

# ------------------------------------------------------------------------------
# Ruff Configuration (Linting & Formatting)
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF"  # Ruff-specific rules
]
ignore = [
    "B008", # Do not perform function call in argument defaults (fastapi Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "api", "dashboard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ------------------------------------------------------------------------------
# Mypy Configuration (Static Type Checking)
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "mlflow.*",
    "dvc.*",
    "sklearn.*",
    "pyreadstat.*",
    "streamlit.*",
]
ignore_missing_imports = true
