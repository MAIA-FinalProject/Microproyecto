version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: ml_api_service
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    networks:
      - ml_network
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    container_name: ml_dashboard_service
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - ml_network
    restart: unless-stopped

networks:
  ml_network:
    driver: bridge
